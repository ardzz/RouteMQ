name: CI

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: uv run --locked python run_tests.py

  lint:
    name: lint
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

  type-check:
    name: type-check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Mypy type check
        run: uv run --locked mypy routemq app bootstrap

  security:
    name: security
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: SAST scan (Bandit)
        run: uv run --locked bandit -c pyproject.toml -r routemq app bootstrap

      - name: Dependency audit (pip-audit)
        run: uv run --locked pip-audit

      - name: Runtime dependency audit (pip-audit, locked no-dev extras)
        run: |
          uv export --locked --format requirements.txt --no-dev --all-extras --no-extra dev \
            --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt"
          uv run --locked pip-audit --strict --disable-pip --require-hashes \
            --requirement "$RUNNER_TEMP/runtime-requirements.txt"

  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests with coverage
        run: uv run --locked coverage run run_tests.py

      - name: Coverage report
        run: uv run --locked coverage report -m

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Build package
        run: uv build

      - name: Build Docker image
        run: docker build --tag routemq:ci-smoke .

      - name: Smoke test Docker image
        run: python scripts/smoke_docker.py --image routemq:ci-smoke

      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-dist
          path: dist/

  install-test:
    name: clean-venv install test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Check lockfile matches pyproject.toml
        run: uv lock --check
      - name: Build wheel
        run: rm -rf dist && uv build --wheel
      - name: Install wheel in clean venv + scaffold + smoke
        run: |
          python -m venv /tmp/install-test/.venv
          source /tmp/install-test/.venv/bin/activate
          WHEEL=$(python -c "from pathlib import Path; print(max(Path('dist').glob('routemq-*.whl'), key=lambda p: p.stat().st_mtime))")
          pip install --quiet "${WHEEL}[cli]"
          routemq --help
          python -c "from routemq.router import Router; from routemq.model import Model; print('imports OK')"
          cd /tmp/install-test
          routemq new demo --yes --with-redis
          test -f demo/app/__init__.py
          test -f demo/pyproject.toml
          grep -q 'name = "demo"' demo/pyproject.toml
          grep -q 'ENABLE_REDIS=true' demo/.env
          deactivate
          echo "install-test PASSED"
