name: Benchmarks

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/release-drafter.yml'
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/release-drafter.yml'
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BENCH_REGRESSION_THRESHOLD_PCT: 20
  BENCH_FLAGS: --benchmark-min-rounds=5 --benchmark-max-time=0.01

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run benchmarks
        run: uv run --locked pytest benchmarks/ --benchmark-only $BENCH_FLAGS --benchmark-json=output.json
      - name: Load master baseline
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/master:benchmarks/baselines/master.json; then
            git show origin/master:benchmarks/baselines/master.json > master-baseline.json
            echo "BENCH_BASELINE_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "No master benchmark baseline exists yet; skipping regression compare."
            echo "BENCH_BASELINE_EXISTS=false" >> "$GITHUB_ENV"
          fi
      - name: Compare against master baseline
        if: github.event_name == 'pull_request' && env.BENCH_BASELINE_EXISTS == 'true'
        run: |
          uv run --locked pytest-benchmark compare master-baseline.json output.json --columns=mean
          uv run --locked python - <<'PY'
          import json
          import os
          import sys

          threshold = float(os.environ.get('BENCH_REGRESSION_THRESHOLD_PCT', '20'))

          with open('master-baseline.json', encoding='utf-8') as fh:
              baseline = json.load(fh)
          with open('output.json', encoding='utf-8') as fh:
              current = json.load(fh)

          baseline_by_name = {item['fullname']: item['stats']['mean'] for item in baseline.get('benchmarks', [])}
          failures = []
          for item in current.get('benchmarks', []):
              name = item['fullname']
              old_mean = baseline_by_name.get(name)
              new_mean = item['stats']['mean']
              if old_mean is None or old_mean <= 0:
                  continue
              change = ((new_mean - old_mean) / old_mean) * 100
              if change > threshold:
                  failures.append(f'{name}: mean regressed {change:.2f}% ({old_mean:.9f}s -> {new_mean:.9f}s)')

          if failures:
              print('Benchmark regressions exceeded threshold:')
              for failure in failures:
                  print(f'- {failure}')
              sys.exit(1)
          print(f'Benchmark mean regressions are within {threshold:.1f}% gate.')
          PY
      - name: Propose master baseline PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BRANCH=benchmarks/master-baseline
          BASELINE=benchmarks/baselines/master.json
          RANGE_BASE=$BEFORE_SHA
          if [[ $BEFORE_SHA =~ ^0+$ ]]; then
            RANGE_BASE=$(git hash-object -t tree /dev/null)
          fi
          CHANGED=$(git diff --no-renames --name-only "$RANGE_BASE" "$GITHUB_SHA")
          if [ "$CHANGED" = "$BASELINE" ]; then
            echo "Push ${BEFORE_SHA}..${GITHUB_SHA} only changes ${BASELINE}; skipping baseline proposal."
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" "$GITHUB_SHA"
          mkdir -p benchmarks/baselines
          cp output.json "$BASELINE"
          git add -- "$BASELINE"
          if git diff --cached --quiet -- "$BASELINE"; then
            echo "Benchmark baseline is unchanged."
            exit 0
          fi
          git commit -m "chore(benchmarks): update master baseline"
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          MASTER_SHA=$(git rev-parse --verify refs/remotes/origin/master)
          if [ "$MASTER_SHA" != "$GITHUB_SHA" ]; then
            echo "master moved from ${GITHUB_SHA} to ${MASTER_SHA}; skipping superseded baseline proposal."
            exit 0
          fi
          LEASE=$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)
          git push --force-with-lease="refs/heads/${BRANCH}:${LEASE}" origin "HEAD:refs/heads/${BRANCH}"
          TITLE="chore(benchmarks): update master baseline"
          BODY="Benchmark baseline measured on master commit ${GITHUB_SHA}.

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base master --head "$BRANCH" \
            --json number,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | .number')
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
