version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dev-patch-minor:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      python-runtime-patch-minor:
        applies-to: version-updates
        dependency-type: "production"
        patterns:
          - "*"
        exclude-patterns:
          - "aiomysql"
          - "asyncpg"
        update-types:
          - "patch"
          - "minor"
      python-dev-security:
        applies-to: security-updates
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
      python-runtime-security:
        applies-to: security-updates
        dependency-type: "production"
        patterns:
          - "*"
        exclude-patterns:
          - "aiomysql"
          - "asyncpg"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/routemq/scaffold/templates/features/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
